server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames never change contents, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
